name: Architecture Decision
description: Propose or record an architecture decision for Atlas.
title: "adr: "
labels: ["architecture", "decision", "triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem forces a decision?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Docs, benchmarks, constraints, experiments.
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences and risks
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback or revision plan
    validations:
      required: true
