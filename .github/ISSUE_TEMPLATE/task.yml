name: Task
description: Coordinate a piece of assigned work. Small fixes can go directly to a PR.
title: "task: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change and why?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Describe the observable result and how to verify it.
    validations:
      required: true
