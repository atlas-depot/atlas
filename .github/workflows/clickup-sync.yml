name: Sync issue status to ClickUp

on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing mapped issue to reconcile
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: clickup-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'atlas-depot/atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Reconcile the existing task
        run: node scripts/clickup-sync.ts
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          GITHUB_TOKEN: ${{ github.token }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
