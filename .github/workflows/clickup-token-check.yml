name: Temporary ClickUp token check

on:
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  read-only-check:
    if: github.event.pull_request.number == 38 && github.event.pull_request.head.repo.full_name == 'atlas-depot/atlas' && github.head_ref == 'chore/clickup-issue-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify token and mapped tasks without writes
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          token = os.environ.get('CLICKUP_API_TOKEN')
          if not token:
              sys.exit('Missing CLICKUP_API_TOKEN')
          client = urllib.request.build_opener(NoRedirect)

          def get(path):
              request = urllib.request.Request(
                  'https://api.clickup.com/api/v2/' + path,
                  headers={'Authorization': token, 'Accept': 'application/json'},
                  method='GET',
              )
              try:
                  with client.open(request, timeout=15) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  sys.exit('ClickUp GET failed: HTTP ' + str(error.code))
              except Exception:
                  sys.exit('ClickUp GET failed without exposing response details')

          tasks = {
              17: 'z8t8qght1z', 18: 'z8t8qght26', 19: 'z8t8qght29',
              20: 'z8t8qght2a', 21: 'z8t8qght2c', 22: 'z8t8qght2f',
              23: 'z8t8qght2h', 24: 'z8t8qght2j', 25: 'z8t8qght2k',
              26: 'z8t8qght2m', 35: 'z8t8qgt5p3',
          }
          for issue, task_id in tasks.items():
              task = get('task/' + task_id)
              if (task.get('id') != task_id
                  or task.get('team_id') != '1100380000018105'
                  or task.get('list', {}).get('id') != '1100380000082079'):
                  sys.exit('Task/workspace/list mismatch for issue ' + str(issue))
              status = task.get('status', {})
              if not isinstance(status.get('status'), str) or not isinstance(status.get('type'), str):
                  sys.exit('Unexpected task status schema')
              print('Issue #' + str(issue) + ': authenticated GET and task boundary verified')

          listing = get('list/1100380000082079')
          if str(listing.get('id')) != '1100380000082079':
              sys.exit('Unexpected list ID')
          statuses = {entry['status'].lower(): entry['type'] for entry in listing.get('statuses', [])}
          for name in ['shipped', 'cancelled']:
              if statuses.get(name) not in ['done', 'closed']:
                  sys.exit('Unexpected terminal status type: ' + name)
          if statuses.get('backlog') not in ['open', 'custom', 'notstarted', 'unstarted']:
              sys.exit('Unexpected backlog status type')
          print('SHIPPED and CANCELLED terminal status types verified; BACKLOG is open')
          print('PASS: read-only token check, 11 mapped tasks, no writes performed')
          PY
