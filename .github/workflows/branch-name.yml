name: Branch name

on: pull_request

permissions: {}

jobs:
  branch-name:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Validate the source branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|adr)/([1-9][0-9]*-)?[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo '::error::Use <type>/<description> or <type>/<issue-number>-<description> with a lowercase kebab-case description. See docs/contributing.md.'
            exit 1
          fi
