version: 2
updates:
  - package-ecosystem: npm
    # The root pnpm workspace also includes agents/organizer.
    directories:
      - /
      - /experiments/eve-openrouter
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Routine major upgrades require a deliberate compatibility review.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # The Vite+ alias pins move together with vite-plus by hand.
      - dependency-name: vite
      - dependency-name: vite-plus
      - dependency-name: "@vitest/coverage-v8"
      - dependency-name: vitest

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
