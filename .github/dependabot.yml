version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # The Vite+ alias pins (vite, vitest and coverage) move together with vite-plus by hand.
    ignore:
      - dependency-name: vite
      - dependency-name: vite-plus
      - dependency-name: "@vitest/coverage-v8"
      - dependency-name: vitest

  - package-ecosystem: npm
    directory: /experiments/eve-openrouter
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
